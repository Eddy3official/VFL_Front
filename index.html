<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Football Engine Cracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>⚡ VIRTUAL FOOTBALL ENGINE CRACKER ⚡</h1>
            <p>Front-End Live Prediction Matrix</p>
        </header>

        <main>
            <!-- Input Control Panel -->
            <section class="control-panel">
                <div class="form-row">
                    <!-- Home Team Custom Dropdown -->
                    <div class="form-group">
                        <label>Home Team</label>
                        <div class="custom-select-container" id="home-select-container">
                            <div class="custom-select-trigger" id="home-trigger">Select Home Team</div>
                            <div class="custom-options" id="home-options">
                                <input type="text" class="search-input" id="home-search" placeholder="Search team...">
                                <div class="options-list" id="home-list"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Away Team Custom Dropdown -->
                    <div class="form-group">
                        <label>Away Team</label>
                        <div class="custom-select-container" id="away-select-container">
                            <div class="custom-select-trigger" id="away-trigger">Select Away Team</div>
                            <div class="custom-options" id="away-options">
                                <input type="text" class="search-input" id="away-search" placeholder="Search team...">
                                <div class="options-list" id="away-list"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-row odds-row">
                    <!-- Odds: Home -->
                    <div class="form-group size-small">
                        <label>Home Odds (1)</label>
                        <input type="number" id="home-odds" step="0.01" min="1.01" placeholder="1.85">
                    </div>
                    <!-- Odds: Draw -->
                    <div class="form-group size-small">
                        <label>Draw Odds (X)</label>
                        <input type="number" id="draw-odds" step="0.01" min="1.01" placeholder="3.40">
                    </div>
                    <!-- Odds: Away -->
                    <div class="form-group size-small">
                        <label>Away Odds (2)</label>
                        <input type="number" id="away-odds" step="0.01" min="1.01" placeholder="4.20">
                    </div>
                </div>

                <button id="crack-btn" class="primary-btn">CRACK FIXTURE</button>
            </section>

            <!-- Results Output Panel -->
            <section class="results-panel hidden" id="results-panel">
                <h2>📊 CRACKER DATA OUTPUT</h2>
                <hr class="divider">
                
                <div class="meta-info">
                    <p><strong>Matchup:</strong> <span id="res-matchup"></span></p>
                    <p><strong>True Math Odds:</strong> <span id="res-true-odds"></span></p>
                    <p><strong>Bookie Margin:</strong> <span id="res-margin" class="highlight-yellow"></span></p>
                </div>
                
                <hr class="divider">

                <div class="prediction-box">
                    <div class="output-item">
                        <span class="label">PROBABLE WINNER:</span>
                        <span id="res-winner" class="value text-green"></span>
                    </div>
                    <div class="output-item">
                        <span class="label">ALGO CONFIDENCE:</span>
                        <span id="res-confidence" class="value"></span>
                    </div>
                    <div class="output-item danger-container">
                        <span class="label">RISK ASSESSMENT:</span>
                        <p id="res-risk" class="value-text"></p>
                    </div>
                </div>

                <hr class="divider">
                
                <div class="templates-box">
                    <h3>MATCHTIMELINE TEMPLATES SPOTTED:</h3>
                    <ul id="res-templates" class="template-list"></ul>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
